<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小編工具箱</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="ui/tokens.css">
<link rel="stylesheet" href="shell/shell.css">
<link rel="stylesheet" href="shell/install.css">
</head>
<body>
<header id="top">
  <button type="button" id="brand" aria-label="回到工具櫥窗">
    <span class="logo" aria-hidden="true">編</span>
    <span class="word">小編<b>工具箱</b></span>
  </button>
  <nav id="toolbar" aria-label="工具列"></nav>
  <div id="status" role="status"></div>
  <button type="button" class="btn btn-secondary btn-sm" id="company-btn">登入</button>
</header>
<main id="stage">
  <section id="showcase" aria-busy="true"></section>
  <section id="work" hidden></section>
  <div id="dropzones" hidden aria-hidden="true">
    <div class="dz" data-side="left"><span>放到左邊</span></div>
    <div class="dz" data-side="right"><span>放到右邊</span></div>
  </div>
</main>
<script type="module" src="shell/main.js"></script>
</body>
</html>
