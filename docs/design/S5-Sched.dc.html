<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<title>S5-4 網新排程帶入中</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#1d4fb8}a:hover{color:#163d8f}
@keyframes sk-shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
.sk{background:linear-gradient(90deg,#eceef0 25%,#dfe2e6 50%,#eceef0 75%);background-size:200% 100%;animation:sk-shimmer 1.5s infinite}
@media (prefers-reduced-motion: reduce){.sk{animation:none}}
</style>
</helmet>
<div style="min-height: 820px; display: flex; flex-direction: column; background: #f6f7f8; color: #202124; font-family: 'Noto Sans TC', system-ui, sans-serif; font-size: 15px;">

  <header style="background: #ffffff; border-bottom: 1px solid #e3e4e6; padding: 10px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px;">
    <a href="#" aria-label="回到工具櫥窗" style="display: flex; align-items: center; gap: 8px; color: #1d4fb8; text-decoration: none;"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="5" fill="currentColor"/><path d="M12 5.5v11.5l-2 -1.6" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 9.5l-2.3 5M16 9.5l2.3 5" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/></svg><span style="font-weight: 700; font-size: 16px; color: #202124;">小編工具箱</span></a>
    <nav aria-label="工具" style="display: flex; flex-wrap: wrap; gap: 6px; flex-grow: 1;">
      <button type="button" aria-pressed="true" style="display: flex; align-items: center; gap: 6px; min-height: 38px; padding: 0 12px 0 10px; border: 1px solid #1d4fb8; border-radius: 6px; background: #eef3fc; color: #1d4fb8; font: inherit; font-size: 14px; font-weight: 500;"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1.5" y="1.5" width="13" height="13" rx="2"/><path d="M4 11h8M4 8.5h5"/></svg>圖片套版</button>
      <button type="button" style="display: flex; align-items: center; gap: 6px; min-height: 38px; padding: 0 12px 0 10px; border: 1px solid #c4c7cc; border-radius: 6px; background: #ffffff; color: #3c4046; font: inherit; font-size: 14px;"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1.5" y="1.5" width="13" height="13" rx="2"/><path d="M1.5 5h13M6 5v9.5M10.5 5v9.5M1.5 10h13"/></svg>LINE 推播</button>
      <button type="button" style="display: flex; align-items: center; gap: 6px; min-height: 38px; padding: 0 12px 0 10px; border: 1px solid #c4c7cc; border-radius: 6px; background: #ffffff; color: #3c4046; font: inherit; font-size: 14px;"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1.5" y="1.5" width="13" height="13" rx="2"/><path d="M8 1.5v13M8 8h6.5"/></svg>拼圖</button>
      <button type="button" style="display: flex; align-items: center; gap: 6px; min-height: 38px; padding: 0 12px 0 10px; border: 1px solid #c4c7cc; border-radius: 6px; background: #ffffff; color: #3c4046; font: inherit; font-size: 14px;"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1.5" y="1.5" width="13" height="13" rx="2"/><rect x="9" y="10" width="3.5" height="2.5"/></svg>浮水印</button>
      <button type="button" style="display: flex; align-items: center; gap: 6px; min-height: 38px; padding: 0 12px 0 10px; border: 1px solid #c4c7cc; border-radius: 6px; background: #ffffff; color: #3c4046; font: inherit; font-size: 14px;"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 6V2h4M14 10v4h-4M2 2l5 5M14 14l-5-5"/></svg>尺寸</button>
      <button type="button" style="display: flex; align-items: center; gap: 6px; min-height: 38px; padding: 0 12px 0 10px; border: 1px solid #c4c7cc; border-radius: 6px; background: #ffffff; color: #3c4046; font: inherit; font-size: 14px;"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 13l1.5-4.5 6-6 3 3-6 6z"/></svg>設計</button>
      <span aria-hidden="true" style="width: 1px; margin: 8px 4px; background: #e3e4e6;"></span>
      <button type="button" aria-pressed="true" style="display: flex; align-items: center; gap: 6px; min-height: 38px; padding: 0 12px 0 10px; border: 1px solid #1d4fb8; border-radius: 6px; background: #eef3fc; color: #1d4fb8; font: inherit; font-size: 14px; font-weight: 500;"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1.5" y="3" width="13" height="11.5" rx="2"/><path d="M1.5 7h13M5 1.5v3M11 1.5v3"/></svg>網新排程</button>
      <button type="button" style="display: flex; align-items: center; gap: 6px; min-height: 38px; padding: 0 12px 0 10px; border: 1px solid #c4c7cc; border-radius: 6px; background: #ffffff; color: #3c4046; font: inherit; font-size: 14px;"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 2v8M4.5 6.5L8 10l3.5-3.5M2.5 13.5h11"/></svg>YT 批量下載</button>
    </nav>
    <span style="padding: 5px 12px; border: 1px solid #a8d5b5; border-radius: 99px; background: #e8f5ec; color: #17682e; font-size: 13px; font-weight: 500; font-variant-numeric: tabular-nums;">網新已登入，剩 12 天</span>
  </header>

  <main style="flex-grow: 1; box-sizing: border-box; padding: 16px; display: flex; flex-wrap: wrap; align-items: stretch;">
    <section aria-label="圖片套版（左）" style="flex: 1 1 420px; min-width: 0; background: #ffffff; border: 1px solid #c4c7cc; border-radius: 10px; display: flex; flex-direction: column; overflow: hidden;">
      <div style="display: flex; align-items: center; gap: 8px; padding: 6px 6px 6px 16px; border-bottom: 1px solid #e3e4e6;">
        <span style="font-weight: 700; flex-grow: 1;">圖片套版</span>
        <button type="button" aria-label="圖片套版改成全頁" style="min-height: 36px; padding: 0 12px; border: 1px solid #c4c7cc; border-radius: 6px; background: #f1f2f4; color: #202124; font: inherit; font-size: 13px;">全頁</button>
        <button type="button" aria-label="關閉圖片套版（內容會保留）" style="width: 36px; height: 36px; border: 1px solid #c4c7cc; border-radius: 6px; background: #f1f2f4; color: #202124; font: inherit; font-size: 18px;">×</button>
      </div>
      <div style="padding: 16px; display: flex; flex-direction: column; gap: 14px;">
        <div style="width: 100%; max-width: 360px; align-self: center; aspect-ratio: 1 / 1; background: #d5d8dc; border: 1px solid #c4c7cc; border-radius: 6px; display: flex; align-items: center; justify-content: center; color: #3c4046; font-size: 13px;">[預覽畫布 1080×1080]</div>
        <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px;">
          <span style="font-size: 13px; color: #55595f; flex-grow: 1;">已自動保留</span>
          <button type="button" style="min-height: 40px; padding: 0 14px; border: 1px solid #c4c7cc; border-radius: 6px; background: #f1f2f4; color: #202124; font: inherit;">下載 PNG</button>
          <button type="button" style="min-height: 40px; padding: 0 14px; border: 1px solid #163d8f; border-radius: 6px; background: #1d4fb8; color: #ffffff; font: inherit; font-weight: 500;">放進右邊排程</button>
        </div>
      </div>
    </section>

    <div role="separator" aria-orientation="vertical" aria-label="拖曳調整左右寬度" tabindex="0" style="flex: 0 0 16px; display: flex; align-items: center; justify-content: center; cursor: col-resize;">
      <span aria-hidden="true" style="width: 4px; height: 48px; border-radius: 2px; background: #c4c7cc;"></span>
    </div>

    <section aria-label="網新排程（右，最後操作）" style="flex: 1 1 420px; min-width: 0; background: #ffffff; border: 1px solid #c4c7cc; border-radius: 10px; display: flex; flex-direction: column; overflow: hidden;">
      <div style="display: flex; align-items: center; gap: 8px; padding: 6px 6px 6px 16px; background: #eef3fc; border-bottom: 1px solid #c9d6f0;">
        <span style="font-weight: 700; color: #1d4fb8;">網新排程</span>
        <span style="font-size: 12px; color: #163d8f; border: 1px solid #1d4fb8; border-radius: 6px; padding: 1px 6px;">最後操作</span>
        <span style="flex-grow: 1;"></span>
        <button type="button" aria-label="網新排程改成全頁" style="min-height: 36px; padding: 0 12px; border: 1px solid #c4c7cc; border-radius: 6px; background: #ffffff; color: #202124; font: inherit; font-size: 13px;">全頁</button>
        <button type="button" aria-label="關閉網新排程（內容會保留）" style="width: 36px; height: 36px; border: 1px solid #c4c7cc; border-radius: 6px; background: #ffffff; color: #202124; font: inherit; font-size: 18px;">×</button>
      </div>
      <div style="padding: 16px; display: flex; flex-direction: column; gap: 14px;">
        <label style="display: flex; flex-direction: column; gap: 6px;">
          <span style="font-size: 13px; color: #55595f;">文章網址</span>
          <div style="display: flex; gap: 8px;">
            <input type="url" value="[https://文章網址]" style="flex-grow: 1; min-width: 0; min-height: 40px; box-sizing: border-box; font: inherit; padding: 0 12px; border: 1px solid #c4c7cc; border-radius: 6px;">
            <button type="button" disabled="" style="min-height: 40px; padding: 0 14px; border: 1px solid #c4c7cc; border-radius: 6px; background: #f1f2f4; color: #55595f; font: inherit;">帶入中</button>
          </div>
        </label>
        <div aria-busy="true" aria-label="正在帶入標題" style="display: flex; flex-direction: column; gap: 6px;">
          <span style="font-size: 13px; color: #55595f;">標題（一行一句）</span>
          <div aria-hidden="true" style="height: 64px; box-sizing: border-box; padding: 10px 12px; border: 1px solid #e3e4e6; border-radius: 6px; display: flex; flex-direction: column; gap: 8px;">
            <div class="sk" style="width: 72%; height: 16px; border-radius: 4px;"></div>
            <div class="sk" style="width: 48%; height: 16px; border-radius: 4px;"></div>
          </div>
        </div>
        <div aria-busy="true" aria-label="正在帶入小編文" style="display: flex; flex-direction: column; gap: 6px;">
          <span style="font-size: 13px; color: #55595f;">小編文</span>
          <div aria-hidden="true" style="height: 136px; box-sizing: border-box; padding: 10px 12px; border: 1px solid #e3e4e6; border-radius: 6px; display: flex; flex-direction: column; gap: 8px;">
            <div class="sk" style="width: 56%; height: 16px; border-radius: 4px;"></div>
            <div class="sk" style="width: 94%; height: 16px; border-radius: 4px;"></div>
            <div class="sk" style="width: 88%; height: 16px; border-radius: 4px;"></div>
            <div class="sk" style="width: 40%; height: 16px; border-radius: 4px;"></div>
          </div>
        </div>
        <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px;">
          <label style="display: flex; align-items: center; gap: 8px;">
            <span style="font-size: 13px; color: #55595f;">發文時間</span>
            <input type="time" value="18:30" style="min-height: 40px; box-sizing: border-box; font: inherit; font-variant-numeric: tabular-nums; padding: 0 10px; border: 1px solid #c4c7cc; border-radius: 6px;">
          </label>
          <span style="flex-grow: 1;"></span>
          <button type="button" disabled="" style="min-height: 44px; padding: 0 20px; border: 1px solid #c4c7cc; border-radius: 6px; background: #e3e4e6; color: #55595f; font: inherit; font-weight: 500;">排入發文</button>
        </div>
      </div>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":820}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
