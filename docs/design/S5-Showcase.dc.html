<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<title>S5-2 櫥窗</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#1d4fb8}a:hover{color:#163d8f}
@keyframes sk-shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
.sk{background:linear-gradient(90deg,#eceef0 25%,#dfe2e6 50%,#eceef0 75%);background-size:200% 100%;animation:sk-shimmer 1.5s infinite}
@media (prefers-reduced-motion: reduce){.sk{animation:none}}
</style>
</helmet>
<div style="min-height: 920px; display: flex; flex-direction: column; background: #f6f7f8; color: #202124; font-family: 'Noto Sans TC', system-ui, sans-serif; font-size: 15px;">

  <header style="background: #ffffff; border-bottom: 1px solid #e3e4e6; padding: 12px 32px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 24px;">
    <div style="display: flex; align-items: center; gap: 10px; flex-grow: 1; color: #1d4fb8;">
      <svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="5" fill="currentColor"/><path d="M12 5.5v11.5l-2 -1.6" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 9.5l-2.3 5M16 9.5l2.3 5" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/></svg>
      <span style="font-weight: 700; font-size: 17px; color: #202124;">小編工具箱</span>
    </div>
    <div style="display: flex; flex-wrap: wrap; gap: 8px;">
      <span style="padding: 5px 12px; border: 1px solid #a8d5b5; border-radius: 99px; background: #e8f5ec; color: #17682e; font-size: 13px; font-weight: 500;">外掛已連線</span>
      <span style="padding: 5px 12px; border: 1px solid #a8d5b5; border-radius: 99px; background: #e8f5ec; color: #17682e; font-size: 13px; font-weight: 500; font-variant-numeric: tabular-nums;">網新已登入，剩 12 天</span>
      <span aria-busy="true" aria-label="正在檢查下載助手" style="display: inline-flex; width: 132px; height: 29px; box-sizing: border-box; border: 1px solid #e3e4e6; border-radius: 99px; overflow: hidden;"><span class="sk" aria-hidden="true" style="flex-grow: 1;"></span></span>
    </div>
  </header>

  <main style="box-sizing: border-box; width: 100%; max-width: 1120px; margin: 0 auto; padding: 36px 32px 48px; display: flex; flex-direction: column; gap: 32px;">
    <h1 style="margin: 0; font-size: 26px; font-weight: 700;">今天要做什麼？</h1>

    <section aria-labelledby="g-make" style="display: flex; flex-direction: column; gap: 14px;">
      <h2 id="g-make" style="margin: 0; font-size: 15px; font-weight: 700; color: #55595f;">做圖</h2>
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 24px;">
        <a href="#" style="display: flex; flex-direction: column; background: #ffffff; border: 1px solid #c4c7cc; border-radius: 10px; overflow: hidden; text-decoration: none; color: #202124;">
          <div style="height: 112px; background: #eceef0; display: flex; align-items: center; justify-content: center;"><svg aria-hidden="true" width="88" height="88" viewBox="0 0 96 96"><rect x="1" y="1" width="94" height="94" rx="4" fill="#ffffff" stroke="#c4c7cc" stroke-width="2"/><rect x="8" y="8" width="80" height="52" rx="2" fill="#d5d8dc"/><rect x="8" y="68" width="66" height="8" rx="2" fill="#1d4fb8"/><rect x="8" y="80" width="48" height="8" rx="2" fill="#202124"/></svg></div>
          <div style="padding: 12px 16px; display: flex; flex-direction: column; gap: 4px;"><span style="font-weight: 700; font-size: 16px;">圖片套版</span><span style="font-size: 13px; color: #55595f;">照片配兩行標題，一次做多張</span></div>
        </a>
        <a href="#" style="display: flex; flex-direction: column; background: #ffffff; border: 1px solid #c4c7cc; border-radius: 10px; overflow: hidden; text-decoration: none; color: #202124;">
          <div style="height: 112px; background: #eceef0; display: flex; align-items: center; justify-content: center;"><svg aria-hidden="true" width="114" height="88" viewBox="0 0 124 96"><rect x="1" y="1" width="122" height="94" rx="4" fill="#ffffff" stroke="#c4c7cc" stroke-width="2"/><rect x="2" y="2" width="120" height="12" fill="#ffe500"/><rect x="8" y="20" width="33" height="32" rx="2" fill="#d5d8dc"/><rect x="45" y="20" width="33" height="32" rx="2" fill="#d5d8dc"/><rect x="82" y="20" width="33" height="32" rx="2" fill="#d5d8dc"/><rect x="8" y="58" width="33" height="32" rx="2" fill="#d5d8dc"/><rect x="45" y="58" width="33" height="32" rx="2" fill="#d5d8dc"/><rect x="82" y="58" width="33" height="32" rx="2" fill="#d5d8dc"/></svg></div>
          <div style="padding: 12px 16px; display: flex; flex-direction: column; gap: 4px;"><span style="font-weight: 700; font-size: 16px;">LINE 推播</span><span style="font-size: 13px; color: #55595f;">熱門話題六宮格、娛樂四格</span></div>
        </a>
        <a href="#" style="display: flex; flex-direction: column; background: #ffffff; border: 1px solid #c4c7cc; border-radius: 10px; overflow: hidden; text-decoration: none; color: #202124;">
          <div style="height: 112px; background: #eceef0; display: flex; align-items: center; justify-content: center;"><svg aria-hidden="true" width="88" height="88" viewBox="0 0 96 96"><rect x="1" y="1" width="94" height="94" rx="4" fill="#ffffff" stroke="#c4c7cc" stroke-width="2"/><rect x="6" y="6" width="50" height="84" rx="2" fill="#d5d8dc"/><rect x="60" y="6" width="30" height="40" rx="2" fill="#b9bdc3"/><rect x="60" y="50" width="30" height="40" rx="2" fill="#d5d8dc"/></svg></div>
          <div style="padding: 12px 16px; display: flex; flex-direction: column; gap: 4px;"><span style="font-weight: 700; font-size: 16px;">拼圖</span><span style="font-size: 13px; color: #55595f;">多張照片無縫拼成一張</span></div>
        </a>
        <a href="#" style="display: flex; flex-direction: column; background: #ffffff; border: 1px solid #c4c7cc; border-radius: 10px; overflow: hidden; text-decoration: none; color: #202124;">
          <div style="height: 112px; background: #eceef0; display: flex; align-items: center; justify-content: center;"><svg aria-hidden="true" width="114" height="78" viewBox="0 0 124 84"><rect x="1" y="1" width="122" height="82" rx="4" fill="#d5d8dc" stroke="#c4c7cc" stroke-width="2"/><rect x="94" y="62" width="22" height="14" rx="2" fill="#ffffff" stroke="#1d4fb8" stroke-width="2"/></svg></div>
          <div style="padding: 12px 16px; display: flex; flex-direction: column; gap: 4px;"><span style="font-weight: 700; font-size: 16px;">浮水印</span><span style="font-size: 13px; color: #55595f;">Logo 自動放在照片最暗的角落</span></div>
        </a>
        <a href="#" style="display: flex; flex-direction: column; background: #ffffff; border: 1px solid #c4c7cc; border-radius: 10px; overflow: hidden; text-decoration: none; color: #202124;">
          <div style="height: 112px; background: #eceef0; display: flex; align-items: center; justify-content: center;"><svg aria-hidden="true" width="114" height="88" viewBox="0 0 124 96"><rect x="1" y="21" width="72" height="54" rx="4" fill="#d5d8dc" stroke="#c4c7cc" stroke-width="2"/><rect x="83" y="1" width="40" height="94" rx="4" fill="#ffffff" stroke="#1d4fb8" stroke-width="2" stroke-dasharray="5 4"/></svg></div>
          <div style="padding: 12px 16px; display: flex; flex-direction: column; gap: 4px;"><span style="font-weight: 700; font-size: 16px;">尺寸</span><span style="font-size: 13px; color: #55595f;">一次把多張照片改成指定寬高</span></div>
        </a>
        <a href="#" style="display: flex; flex-direction: column; background: #ffffff; border: 1px solid #c4c7cc; border-radius: 10px; overflow: hidden; text-decoration: none; color: #202124;">
          <div style="height: 112px; background: #eceef0; display: flex; align-items: center; justify-content: center;"><svg aria-hidden="true" width="100" height="88" viewBox="0 0 110 96"><rect x="1" y="1" width="80" height="80" rx="4" fill="#ffffff" stroke="#c4c7cc" stroke-width="2"/><rect x="14" y="14" width="80" height="80" rx="4" fill="#ffffff" stroke="#c4c7cc" stroke-width="2"/><rect x="28" y="28" width="40" height="22" rx="2" fill="#d5d8dc"/><circle cx="78" cy="68" r="10" fill="none" stroke="#1d4fb8" stroke-width="2"/><rect x="28" y="58" width="32" height="6" rx="2" fill="#202124"/></svg></div>
          <div style="padding: 12px 16px; display: flex; flex-direction: column; gap: 4px;"><span style="font-weight: 700; font-size: 16px;">設計</span><span style="font-size: 13px; color: #55595f;">文字、圖片、形狀自由排版，可多頁</span></div>
        </a>
      </div>
    </section>

    <section aria-labelledby="g-post" style="display: flex; flex-direction: column; gap: 14px;">
      <h2 id="g-post" style="margin: 0; font-size: 15px; font-weight: 700; color: #55595f;">發文與素材</h2>
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 24px;">
        <a href="#" style="display: flex; align-items: center; gap: 14px; padding: 16px; background: #ffffff; border: 1px solid #c4c7cc; border-radius: 10px; text-decoration: none; color: #202124;">
          <svg aria-hidden="true" width="40" height="40" viewBox="0 0 16 16" fill="none" stroke="#1d4fb8" stroke-width="1.2"><rect x="1.5" y="3" width="13" height="11.5" rx="2"/><path d="M1.5 7h13M5 1.5v3M11 1.5v3"/></svg>
          <div style="display: flex; flex-direction: column; gap: 4px;"><span style="font-weight: 700; font-size: 16px;">網新排程</span><span style="font-size: 13px; color: #55595f;">貼文章網址，帶入標題與小編文</span></div>
        </a>
        <div aria-busy="true" aria-label="YT 批量下載：正在檢查下載助手" style="display: flex; align-items: center; gap: 14px; padding: 16px; background: #ffffff; border: 1px solid #c4c7cc; border-radius: 10px;">
          <svg aria-hidden="true" width="40" height="40" viewBox="0 0 16 16" fill="none" stroke="#1d4fb8" stroke-width="1.2"><path d="M8 2v8M4.5 6.5L8 10l3.5-3.5M2.5 13.5h11"/></svg>
          <div style="display: flex; flex-direction: column; gap: 4px; flex-grow: 1;"><span style="font-weight: 700; font-size: 16px;">YT 批量下載</span><span class="sk" aria-hidden="true" style="display: block; width: 180px; height: 19px; border-radius: 4px;"></span></div>
        </div>
      </div>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":920}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
