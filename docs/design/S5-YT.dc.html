<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<title>S5-3 YT 批量下載</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#1d4fb8}a:hover{color:#163d8f}
@keyframes sk-shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
.sk{background:linear-gradient(90deg,#eceef0 25%,#dfe2e6 50%,#eceef0 75%);background-size:200% 100%;animation:sk-shimmer 1.5s infinite}
@media (prefers-reduced-motion: reduce){.sk{animation:none}}
</style>
</helmet>
<div style="min-height: 820px; display: flex; flex-direction: column; background: #f6f7f8; color: #202124; font-family: 'Noto Sans TC', system-ui, sans-serif; font-size: 15px;">

  <header style="background: #ffffff; border-bottom: 1px solid #e3e4e6; padding: 10px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px;">
    <a href="#" aria-label="回到工具櫥窗" style="display: flex; align-items: center; gap: 8px; color: #1d4fb8; text-decoration: none;"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="5" fill="currentColor"/><path d="M12 5.5v11.5l-2 -1.6" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 9.5l-2.3 5M16 9.5l2.3 5" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/></svg><span style="font-weight: 700; font-size: 16px; color: #202124;">小編工具箱</span></a>
    <nav aria-label="工具" style="display: flex; flex-wrap: wrap; gap: 6px; flex-grow: 1;">
      <button type="button" style="display: flex; align-items: center; gap: 6px; min-height: 38px; padding: 0 12px 0 10px; border: 1px solid #c4c7cc; border-radius: 6px; background: #ffffff; color: #3c4046; font: inherit; font-size: 14px;"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1.5" y="1.5" width="13" height="13" rx="2"/><path d="M4 11h8M4 8.5h5"/></svg>圖片套版</button>
      <button type="button" style="display: flex; align-items: center; gap: 6px; min-height: 38px; padding: 0 12px 0 10px; border: 1px solid #c4c7cc; border-radius: 6px; background: #ffffff; color: #3c4046; font: inherit; font-size: 14px;"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1.5" y="1.5" width="13" height="13" rx="2"/><path d="M1.5 5h13M6 5v9.5M10.5 5v9.5M1.5 10h13"/></svg>LINE 推播</button>
      <button type="button" style="display: flex; align-items: center; gap: 6px; min-height: 38px; padding: 0 12px 0 10px; border: 1px solid #c4c7cc; border-radius: 6px; background: #ffffff; color: #3c4046; font: inherit; font-size: 14px;"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1.5" y="1.5" width="13" height="13" rx="2"/><path d="M8 1.5v13M8 8h6.5"/></svg>拼圖</button>
      <button type="button" style="display: flex; align-items: center; gap: 6px; min-height: 38px; padding: 0 12px 0 10px; border: 1px solid #c4c7cc; border-radius: 6px; background: #ffffff; color: #3c4046; font: inherit; font-size: 14px;"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1.5" y="1.5" width="13" height="13" rx="2"/><rect x="9" y="10" width="3.5" height="2.5"/></svg>浮水印</button>
      <button type="button" style="display: flex; align-items: center; gap: 6px; min-height: 38px; padding: 0 12px 0 10px; border: 1px solid #c4c7cc; border-radius: 6px; background: #ffffff; color: #3c4046; font: inherit; font-size: 14px;"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 6V2h4M14 10v4h-4M2 2l5 5M14 14l-5-5"/></svg>尺寸</button>
      <button type="button" style="display: flex; align-items: center; gap: 6px; min-height: 38px; padding: 0 12px 0 10px; border: 1px solid #c4c7cc; border-radius: 6px; background: #ffffff; color: #3c4046; font: inherit; font-size: 14px;"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 13l1.5-4.5 6-6 3 3-6 6z"/></svg>設計</button>
      <span aria-hidden="true" style="width: 1px; margin: 8px 4px; background: #e3e4e6;"></span>
      <button type="button" style="display: flex; align-items: center; gap: 6px; min-height: 38px; padding: 0 12px 0 10px; border: 1px solid #c4c7cc; border-radius: 6px; background: #ffffff; color: #3c4046; font: inherit; font-size: 14px;"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1.5" y="3" width="13" height="11.5" rx="2"/><path d="M1.5 7h13M5 1.5v3M11 1.5v3"/></svg>網新排程</button>
      <button type="button" aria-pressed="true" style="display: flex; align-items: center; gap: 6px; min-height: 38px; padding: 0 12px 0 10px; border: 1px solid #1d4fb8; border-radius: 6px; background: #eef3fc; color: #1d4fb8; font: inherit; font-size: 14px; font-weight: 500;"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 2v8M4.5 6.5L8 10l3.5-3.5M2.5 13.5h11"/></svg>YT 批量下載</button>
    </nav>
    <span style="padding: 5px 12px; border: 1px solid #a8d5b5; border-radius: 99px; background: #e8f5ec; color: #17682e; font-size: 13px; font-weight: 500;">下載助手已連線</span>
  </header>

  <main style="flex-grow: 1; box-sizing: border-box; width: 100%; max-width: 1040px; margin: 0 auto; padding: 24px; display: flex; flex-direction: column; gap: 16px;">
    <div style="background: #ffffff; border: 1px solid #e3e4e6; border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 14px;">
      <label style="display: flex; flex-direction: column; gap: 6px;">
        <span style="font-size: 13px; color: #55595f;">YouTube 網址（可一次貼多個）</span>
        <div style="display: flex; gap: 8px;">
          <input type="url" value="" placeholder="https://www.youtube.com/watch?v=…" style="flex-grow: 1; min-width: 0; min-height: 44px; box-sizing: border-box; font: inherit; padding: 0 12px; border: 1px solid #c4c7cc; border-radius: 6px;">
          <button type="button" style="min-height: 44px; padding: 0 18px; border: 1px solid #c4c7cc; border-radius: 6px; background: #f1f2f4; color: #202124; font: inherit;">增加</button>
        </div>
      </label>
      <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px;">
        <div role="group" aria-label="下載內容" style="display: flex; border: 1px solid #c4c7cc; border-radius: 6px; overflow: hidden;">
          <button type="button" aria-pressed="true" style="min-height: 36px; padding: 0 16px; border: 0; background: #1d4fb8; color: #ffffff; font: inherit; font-size: 14px;">影片</button>
          <button type="button" aria-pressed="false" style="min-height: 36px; padding: 0 16px; border: 0; border-left: 1px solid #c4c7cc; background: #ffffff; color: #3c4046; font: inherit; font-size: 14px;">音訊</button>
        </div>
        <div role="group" aria-label="解析度" style="display: flex; border: 1px solid #c4c7cc; border-radius: 6px; overflow: hidden;">
          <button type="button" aria-pressed="false" style="min-height: 36px; padding: 0 16px; border: 0; background: #ffffff; color: #3c4046; font: inherit; font-size: 14px;">720p</button>
          <button type="button" aria-pressed="true" style="min-height: 36px; padding: 0 16px; border: 0; border-left: 1px solid #c4c7cc; background: #1d4fb8; color: #ffffff; font: inherit; font-size: 14px;">1080p</button>
        </div>
        <span style="flex-grow: 1;"></span>
        <button type="button" style="min-height: 44px; padding: 0 20px; border: 1px solid #163d8f; border-radius: 6px; background: #1d4fb8; color: #ffffff; font: inherit; font-weight: 500; font-variant-numeric: tabular-nums;">開始全部下載（3 支）</button>
      </div>
    </div>

    <section aria-label="下載清單" style="background: #ffffff; border: 1px solid #e3e4e6; border-radius: 10px; display: flex; flex-direction: column;">
      <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 14px; padding: 12px 14px; border-bottom: 1px solid #e3e4e6;">
        <div style="width: 112px; height: 63px; background: #d5d8dc; border-radius: 4px; flex-shrink: 0;"></div>
        <div style="flex: 1 1 240px; min-width: 0; display: flex; flex-direction: column; gap: 8px;">
          <span style="font-weight: 500; line-height: 19px;">[影片標題一]</span>
          <div role="progressbar" aria-label="下載進度" aria-valuenow="62" aria-valuemin="0" aria-valuemax="100" style="height: 6px; background: #e3e4e6; border-radius: 3px;"><div style="width: 62%; height: 6px; background: #1d4fb8; border-radius: 3px;"></div></div>
          <span style="font-size: 13px; line-height: 18px; color: #55595f; font-variant-numeric: tabular-nums;">下載中 62%　1.8 MB/s　剩 00:42</span>
        </div>
        <button type="button" style="min-height: 36px; padding: 0 12px; border: 1px solid #c4c7cc; border-radius: 6px; background: #f1f2f4; color: #202124; font: inherit; font-size: 14px;">複製內文</button>
        <button type="button" aria-label="從清單移除[影片標題一]" style="width: 36px; height: 36px; border: 1px solid #c4c7cc; border-radius: 6px; background: #f1f2f4; color: #202124; font: inherit; font-size: 18px;">×</button>
      </div>

      <div aria-busy="true" aria-label="正在讀取剛加入的影片資訊" style="display: flex; flex-wrap: wrap; align-items: center; gap: 14px; padding: 12px 14px; border-bottom: 1px solid #e3e4e6;">
        <div class="sk" aria-hidden="true" style="width: 112px; height: 63px; border-radius: 4px; flex-shrink: 0;"></div>
        <div aria-hidden="true" style="flex: 1 1 240px; min-width: 0; display: flex; flex-direction: column; gap: 8px;">
          <div class="sk" style="width: 60%; height: 19px; border-radius: 4px;"></div>
          <div class="sk" style="height: 6px; border-radius: 3px;"></div>
          <div class="sk" style="width: 38%; height: 18px; border-radius: 4px;"></div>
        </div>
        <div class="sk" aria-hidden="true" style="width: 86px; height: 36px; border-radius: 6px;"></div>
        <div class="sk" aria-hidden="true" style="width: 36px; height: 36px; border-radius: 6px;"></div>
      </div>

      <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 14px; padding: 12px 14px;">
        <div style="width: 112px; height: 63px; background: #d5d8dc; border-radius: 4px; flex-shrink: 0;"></div>
        <div style="flex: 1 1 240px; min-width: 0; display: flex; flex-direction: column; gap: 8px;">
          <span style="font-weight: 500; line-height: 19px;">[影片標題三]</span>
          <div style="height: 6px; background: #e3e4e6; border-radius: 3px;"></div>
          <span style="font-size: 13px; line-height: 18px; color: #55595f; font-variant-numeric: tabular-nums;">排隊中，前一支完成後冷卻 08 秒</span>
        </div>
        <button type="button" style="min-height: 36px; padding: 0 12px; border: 1px solid #c4c7cc; border-radius: 6px; background: #f1f2f4; color: #202124; font: inherit; font-size: 14px;">複製內文</button>
        <button type="button" aria-label="從清單移除[影片標題三]" style="width: 36px; height: 36px; border: 1px solid #c4c7cc; border-radius: 6px; background: #f1f2f4; color: #202124; font: inherit; font-size: 18px;">×</button>
      </div>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":820}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
