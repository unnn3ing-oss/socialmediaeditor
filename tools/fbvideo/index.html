<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>影片發布</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap">
<link rel="stylesheet" href="../../ui/tokens.css">
<link rel="stylesheet" href="fbvideo.css">
</head>
<body>
<main class="off" id="offMain">
  <section class="off-box" role="status" aria-labelledby="offTitle">
    <h1 id="offTitle">影片發布 功能停用</h1>
    <p>這個工具目前沒有開放。</p>
    <p id="offReason" class="off-reason" hidden></p>
    <div id="needStaff" hidden>
      <p class="off-reason">影片發布需要用員工編號登入</p>
      <button type="button" class="btn btn-primary" id="needStaffBtn">用員工編號登入</button>
    </div>
  </section>
</main>

<main class="fv" id="app" hidden>
  <header class="fv-head">
    <h1>影片發布</h1>
    <span class="pill" id="pagesState">已連線 0 個粉專</span>
    <span class="who" id="whoAmI" hidden></span>
    <span class="pill pill-warn test-pill">測試模式（僅管理員）</span>
    <span class="grow"></span>
    <div class="seg" role="tablist" aria-label="分頁" id="tabs">
      <button type="button" role="tab" class="is-on" aria-selected="true" data-tab="new">新增影片</button>
      <button type="button" role="tab" aria-selected="false" data-tab="log">送出紀錄</button>
    </div>
  </header>
  <p class="tok-warn" id="tokWarn" role="alert" hidden></p>

  <!-- 新增影片：左 1/3 列表、右 2/3 內容 -->
  <section id="tab-new" class="fv-grid">
    <aside class="side" id="drop" aria-label="影片列表">
      <div class="side-head">
        <b id="vqSum">影片 0 支</b>
        <span class="grow"></span>
        <input type="file" id="fileIn" accept="video/mp4,video/quicktime,.mp4,.mov" multiple hidden>
        <button type="button" class="btn btn-secondary btn-sm" id="pickBtn">＋ 加影片</button>
      </div>
      <p class="drop-hint">拖曳影片到這裡（mp4／mov，可多支）</p>
      <ul class="vq-list" id="vqList"></ul>
    </aside>
    <section class="main" aria-label="影片內容">
      <div id="editors"></div>
      <p class="empty hint" id="emptyHint">還沒有影片。加影片並勾選粉專後會在背景開始上傳，上傳時可以繼續填文案。</p>
    </section>
  </section>

  <!-- 送出紀錄 -->
  <section id="tab-log" class="card" hidden>
    <div class="bar">
      <button type="button" class="btn btn-secondary btn-sm" id="logReload">刷新</button>
      <p class="hint" id="logHint" role="status">按「刷新」讀取最近 7 天這個工具送出的影片</p>
    </div>
    <ul class="log" id="logList"></ul>
  </section>

  <footer class="fv-foot" id="foot">
    <div class="foot-row">
      <div class="st" id="st">
        <div class="st-track"><div class="st-fill" id="stFill"></div></div>
        <p class="st-text" id="stText" role="status"></p>
      </div>
      <button type="button" class="btn btn-secondary btn-sm" id="restartBtn" hidden>重新上傳</button>
      <p class="hint" id="footMsg"></p>
      <span class="grow"></span>
      <label class="switch-wrap rd-wrap"><input type="checkbox" class="switch" id="rdOn"> 排入 RD</label>
      <button type="button" class="btn btn-secondary" id="stopBtn" hidden>停止上傳</button>
      <button type="button" class="btn btn-primary" id="sendBtn">全部送出</button>
    </div>
  </footer>
</main>

<!-- 每支影片的內容（隱藏切換，內容保留） -->
<template id="edTpl">
  <section class="ed card">
    <fieldset class="ed-body">
      <legend class="sr">影片內容</legend>
      <div class="pg-head">
        <span class="lbl">發布粉專</span>
        <span class="grow"></span>
        <button type="button" class="btn btn-secondary btn-sm apply-all">套用到全部影片</button>
      </div>
      <details class="pg-dd">
        <summary><span class="pg-sum">尚未選粉專</span><span class="caret" aria-hidden="true"></span></summary>
        <ul class="pg-list"></ul>
      </details>
      <span class="lbl">類型</span>
      <div class="row">
        <div class="seg seg-sm kind" role="group" aria-label="影片類型">
          <button type="button" data-kind="video" aria-pressed="false">橫式影片</button>
          <button type="button" data-kind="reel" aria-pressed="false">Reels</button>
        </div>
        <span class="kind-why hint"></span>
        <span class="grow"></span>
        <span class="cover">
          <span class="cover-lbl">封面</span>
          <span class="cover-img" aria-hidden="true"><span>臉書自動</span></span>
          <button type="button" class="btn btn-secondary btn-sm cover-btn">從影片選封面</button>
        </span>
      </div>
      <p class="kind-warn warn" hidden></p>
      <label class="lbl">影片標題<span class="sub">（臉書標題欄位）</span><input type="text" class="title" maxlength="255"></label>
      <label class="lbl">影片內文<textarea class="msg" rows="7"></textarea></label>
      <p class="msg-warn warn" hidden></p>
      <span class="lbl">標籤（hashtag）</span>
      <div class="tags" role="group" aria-label="hashtag"></div>
      <div class="tag-add">
        <input type="text" class="tag-in" maxlength="50" placeholder="自訂 hashtag，例：颱風" aria-label="自訂 hashtag">
        <button type="button" class="btn btn-secondary btn-sm tag-add-btn">＋ 加入</button>
      </div>
      <label class="lbl">授權<input type="text" class="lic" placeholder="照原樣放在 hashtag 下一行，空白＝不放"></label>
      <span class="lbl">留言（選填）</span>
      <div class="cm-list"></div>
      <button type="button" class="btn btn-secondary btn-sm cm-add">＋ 新增留言</button>
      <label class="lbl rd-slug-l">RD SLUG<input type="text" class="slug" maxlength="20"></label>
    </fieldset>
  </section>
</template>

<dialog class="dlg cover-dlg" id="coverDlg" aria-labelledby="coverTitle">
  <h2 id="coverTitle">選擇封面（從影片取一格）</h2>
  <video id="coverVid" muted playsinline preload="auto"></video>
  <div class="scrub">
    <span class="hint" id="coverCur">0:00</span>
    <input type="range" id="coverRange" min="0" max="1000" value="0" step="1" aria-label="影片時間">
    <span class="hint" id="coverDur">0:00</span>
    <button type="button" class="btn btn-secondary btn-sm" id="coverPrev">‹ 前一格</button>
    <button type="button" class="btn btn-secondary btn-sm" id="coverNext">下一格 ›</button>
  </div>
  <p class="hint">快速挑選（平均取 8 格）</p>
  <div class="strip" id="coverStrip"></div>
  <div class="actions">
    <button type="button" class="btn btn-secondary" id="coverAuto">恢復臉書自動封面</button>
    <span class="grow"></span>
    <button type="button" class="btn btn-secondary" id="coverCancel">取消</button>
    <button type="button" class="btn btn-primary" id="coverUse">使用這一格</button>
  </div>
</dialog>

<div class="toast" id="toast" role="alert" hidden></div>

<dialog class="dlg" id="cfDlg" aria-labelledby="cfTitle">
  <h2 id="cfTitle"></h2>
  <p id="cfBody"></p>
  <div class="actions">
    <button type="button" class="btn btn-secondary" id="cfNo">返回</button>
    <button type="button" class="btn btn-primary" id="cfYes">確定</button>
  </div>
</dialog>
<script type="module" src="app.js"></script>
</body>
</html>
