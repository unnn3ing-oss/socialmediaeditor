<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>排程發布</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;800;900&display=swap">
<link rel="stylesheet" href="../../ui/tokens.css">
<link rel="stylesheet" href="fbpost.css">
<link rel="stylesheet" href="../../ui/compose/fx.css">
<style>
  .off { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px; box-sizing: border-box; }
  .off-box { max-width: 420px; width: 100%; text-align: center; padding: 32px 24px; border: 1px solid var(--line, #e3e7ee); border-radius: 16px; background: var(--surface, #fff); }
  .off-box h1 { margin: 0 0 12px; font-size: 1.4rem; }
  .off-box p { margin: 6px 0; color: var(--muted, #5b6472); line-height: 1.6; }
  .off-box .off-reason { color: var(--danger, #b42318); font-weight: 600; }
</style>
</head>
<body>
<main class="off">
  <section class="off-box" id="fbpostOff" role="status" aria-labelledby="offTitle">
    <h1 id="offTitle">排程發布 功能停用</h1>
    <p>這個工具正在重新撰寫，暫時無法使用。</p>
    <p>臉書上已經排好的貼文不受影響。</p>
    <p id="offReason" class="off-reason" hidden></p>
  </section>
</main>

<main class="fp" id="fbpostApp" hidden>
  <header class="fp-head">
    <h1>排程發布</h1>
    <span class="pill warn">測試模式（僅管理員）</span>
    <span class="grow"></span>
    <button type="button" class="btn btn-primary" id="newBtn">＋ 新增發文</button>
  </header>
  <div class="tabs" role="tablist" aria-label="分頁" id="tabs">
    <button type="button" role="tab" class="is-on" aria-selected="true" data-tab="sched">已排程</button>
    <button type="button" role="tab" aria-selected="false" data-tab="pub">已發佈</button>
  </div>

  <section id="tab-sched" class="card">
    <div class="bar">
      <label class="inline">粉專 <select id="schedPage"></select></label>
      <button type="button" class="btn btn-secondary btn-sm" id="schedReload">刷新</button>
    </div>
    <p class="hint" id="schedHint" role="status"></p>
    <ul class="list" id="schedList"></ul>
  </section>

  <section id="tab-pub" class="card" hidden>
    <div class="bar">
      <label class="inline">粉專 <select id="pubPage"></select></label>
      <button type="button" class="btn btn-secondary btn-sm" id="pubReload">刷新</button>
    </div>
    <p class="hint" id="pubHint" role="status"></p>
    <ul class="list" id="pubList"></ul>
    <button type="button" class="btn btn-secondary btn-sm" id="pubMore" hidden>載入更多</button>
  </section>
</main>

<!-- 新增發文：彈出視窗（隱藏切換，關閉後內容保留） -->
<div class="veil" id="postDlg" hidden>
  <section class="post" role="dialog" aria-modal="true" aria-labelledby="postTitle" id="tab-new">
    <header class="post-head">
      <h2 id="postTitle">新增發文</h2>
      <span class="pill warn">測試模式</span>
      <span class="grow"></span>
      <button type="button" class="btn btn-secondary btn-sm" id="clearBtn">清空</button>
      <button type="button" class="xbtn" id="dlgClose" aria-label="關閉">×</button>
    </header>
    <div class="post-body">
    <label class="lbl" for="link">文章網址</label>
    <div class="pullrow">
      <input id="link" type="url" inputmode="url" placeholder="https://news.tvbs.com.tw/...">
      <button type="button" class="btn btn-secondary" id="pullBtn">帶入</button>
    </div>
    <p class="hint" id="pullHint" role="status">貼上公司新聞網址會自動帶入標題、主圖與貼文內容；發布後第一則留言會放這個連結＋該粉專的 UTM。</p>

    <div class="seg" id="modeSeg" role="group" aria-label="圖片">
      <button type="button" data-mode="image">作圖框</button>
      <button type="button" data-mode="color">純文字底圖</button>
      <button type="button" data-mode="own">自己的圖</button>
    </div>

    <div class="compose">
      <div class="preview">
        <div class="canvas-wrap" id="cvWrap">
          <canvas id="cv" width="1080" height="1080" aria-label="圖片預覽"></canvas>
          <p class="cv-empty" id="cvEmpty">貼網址帶入，或選一張照片</p>
        </div>
        <img id="imgPrev" alt="自己的圖預覽" hidden>
        <div class="fx-bar" id="fxBar">
          <div class="fx-bar-head"><strong>貼圖與馬賽克</strong><span class="fx-count" id="fxCount"></span></div>
          <div id="fxSlot"></div>
          <div class="fx-hint" id="fxHint"></div>
        </div>
      </div>
      <div class="opts">
        <div id="imageOpts">
          <label class="lbl" for="photo">照片</label>
          <input type="file" id="photo" accept="image/*">
          <div class="seg" id="frameSeg" role="group" aria-label="框">
            <button type="button" data-frame="news">新聞（藍框）</button>
            <button type="button" data-frame="entertainment">娛樂（粉框）</button>
          </div>
        </div>
        <div id="colorOpts" hidden>
          <span class="lbl">底色</span>
          <div class="swatches" id="swatches" role="group" aria-label="底色"></div>
        </div>
        <div id="ownOpts" hidden>
          <label class="lbl" for="img">自己的圖（jpeg／png，直接上傳不套版）</label>
          <input type="file" id="img" accept="image/jpeg,image/png">
        </div>
        <div id="titleBox">
          <label class="lbl" for="title">標題（Enter 換行，最多 4 行）</label>
          <textarea id="title" rows="4" placeholder="帶入時自動換行"></textarea>
        </div>
      </div>
    </div>

    <label class="lbl" for="msg">貼文內容</label>
    <textarea id="msg" rows="6" placeholder="小編文（第一行）&#10;【標題】&#10;（圖說）&#10;#hashtag"></textarea>
    <label class="lbl" for="lead">留言文字</label>
    <input id="lead" type="text" maxlength="200" value="看更多新聞內容">
    <p class="hint">留言＝這段文字＋換行＋文章連結＋各粉專 UTM；清空就只放連結。</p>
    </div>
    <footer class="post-foot">
      <div class="chips" id="pages" role="group" aria-label="發到哪些粉專"></div>
      <div class="sendrow">
        <div class="rd">
          <label class="rd-switch"><input type="checkbox" id="rdOn"><span class="track" aria-hidden="true"></span><span class="rd-lbl">排入 RD</span></label>
          <input type="text" id="rdSlug" maxlength="40" placeholder="SLUG（空白＝標題前 4 字）" aria-label="SLUG">
        </div>
        <button type="button" class="send" id="sendBtn" disabled>全部送出（0 個粉專）</button>
      </div>
      <p class="hint bad" id="sendErr" role="alert"></p>
      <ul class="results" id="results" aria-live="polite"></ul>
    </footer>
  </section>
</div>

<!-- 排程時間小視窗（貼在點到的粉專膠囊上方） -->
<div class="timepop" id="timePop" role="dialog" aria-label="排程時間" hidden>
  <h3>排程時間</h3>
  <div class="seg tp-mode"><button type="button" data-tp="now">立即</button><button type="button" data-tp="sched">排程</button></div>
  <div class="tp-row">
    <input type="date" id="tpDate" aria-label="日期">
    <input type="text" id="tpTime" inputmode="numeric" maxlength="5" aria-label="時間">
  </div>
  <p class="tp-hint" id="tpHint" role="status"></p>
  <div class="tp-quick"><button type="button" data-q="30">+30 分</button><button type="button" data-q="60">+1 小時</button><button type="button" data-q="tomorrow">明天</button></div>
</div>


<dialog class="dlg" id="cfDlg" aria-labelledby="cfTitle">
  <h2 id="cfTitle"></h2>
  <p id="cfBody"></p>
  <div class="actions">
    <button type="button" class="btn btn-secondary" id="cfNo">返回</button>
    <button type="button" class="btn btn-primary" id="cfYes">確定</button>
  </div>
</dialog>
<script type="module" src="app.js"></script>
</body>
</html>
