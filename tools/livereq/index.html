<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>直播需求單</title>
<link rel="stylesheet" href="../../ui/tokens.css">
<link rel="stylesheet" href="tool.css">
</head>
<body>
<main class="lr">
  <section class="lr-top">
    <div class="lr-duty">
      <label class="field">值班小編
        <input id="dutyName" type="text" autocomplete="off" placeholder="姓名">
      </label>
      <label class="field">分機或手機
        <input id="dutyContact" type="text" autocomplete="off" placeholder="#85001 或 09xx">
      </label>
      <p class="lr-hint" id="dutyHint"></p>
    </div>
    <label class="field">貼上直播需求單（可一次貼多場；再貼會取代上一份）
      <textarea id="src" rows="3" spellcheck="false"></textarea>
    </label>
    <div class="lr-actions">
      <span class="lr-count" id="count"></span>
      <button type="button" class="btn btn-secondary btn-sm" id="clear">清空</button>
      <button type="button" class="btn btn-primary btn-sm" id="run">解析</button>
    </div>
  </section>
  <p class="lr-empty" id="empty" hidden>找不到需求單欄位（●／◎ 開頭的「新聞事件」「直播平台」「YT標」等），請確認貼上的內容。</p>
  <section class="lr-pagesbar" id="pagesBar" hidden></section>
  <nav class="lr-nav" id="nav" hidden aria-label="場次">
    <button type="button" class="btn btn-secondary btn-sm" id="prev">‹ 上一張</button>
    <span class="lr-pos" id="pos"></span>
    <span class="lr-dots" id="dots"></span>
    <button type="button" class="btn btn-secondary btn-sm" id="next">下一張 ›</button>
  </nav>
  <section class="lr-list" id="list" aria-live="polite"></section>
</main>
<template id="cardTpl">
  <article class="lr-card">
    <header class="lr-head">
      <h2 class="lr-title"></h2>
      <span class="lr-time"></span>
      <span class="lr-tag" data-repeat hidden>更正版</span>
      <button type="button" class="btn btn-primary lr-copy" data-copy>複製</button>
    </header>
    <label class="field lr-event" hidden>新聞事件（需求單沒寫，請補上）
      <input type="text" data-event autocomplete="off">
    </label>
    <label class="field lr-event" data-timewrap hidden>直播時間（需求單沒寫，請補上）
      <input type="text" data-time autocomplete="off" placeholder="例如 1430">
    </label>
    <ul class="lr-checks" data-checks></ul>
    <label class="field">完整需求單（可直接改，複製以這裡為準）
      <textarea data-out rows="10" spellcheck="false"></textarea>
    </label>
    <div class="lr-foot">
      <span class="lr-msg" data-msg></span>
      <button type="button" class="btn btn-secondary btn-sm" data-regen hidden>重新產生</button>
      <button type="button" class="btn btn-secondary btn-sm" data-weather hidden>複製封面提醒</button>
    </div>
    <div class="lr-weather" data-wbox hidden>
      <p class="lr-hint">提醒影音小幫手製作封面（他們輪流剪 SOT 與做封面，需要等一下）。早班約 15:30 還沒收到氣象需求單，可以到群組詢問。</p>
      <pre class="lr-pre" data-wtext></pre>
    </div>
  </article>
</template>
<template id="pagesTpl">
  <div class="lr-pages">
    <span class="lr-label">FB 粉專</span>
    <span class="lr-boxes" data-boxes></span>
    <span class="lr-have" data-have></span>
  </div>
</template>
<script type="module" src="tool.js"></script>
</body>
</html>
